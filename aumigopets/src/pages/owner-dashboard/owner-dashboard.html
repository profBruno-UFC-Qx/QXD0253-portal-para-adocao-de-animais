<!DOCTYPE html>
<html lang="pt-BR">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Dashboard do Proprietário</title>
   <link rel="stylesheet" href="../../../../css/style.css">
   <link rel="stylesheet" href="../../styles/owner-dashboard.css">
</head>
<body>
   <div class="app">
      <aside class="sideBar">
         <section class="logo">
            <img src="../../../../assets/logo.webp" alt="AuMigo" class="logo">
         </section>

         <nav class="menu" aria-label="Menu do proprietário">
            <a class="active" href="#" data-dashboard-option="pipeline">&#x1F4CA; Pipeline</a>
            <a href="#" data-dashboard-option="agenda">&#x1F4C5; Gestão de Agenda</a>
            <a href="#" data-dashboard-option="servicos">&#x1F4DD; Serviços &amp; Preços</a>
            <a href="#" data-dashboard-option="clientes">&#x1F465; Tutores &amp; Pets</a>
            <a href="#" data-dashboard-option="financeiro">&#x1F4B0; Caixa &amp; Financeiro</a>
            <a href="#" data-dashboard-option="despesas">&#x1F4B8; Controle de Despesas</a>
            <a href="#" data-dashboard-option="relatorios">&#x1F4C8; Relatórios &amp; Lucro</a>
            <a href="#" data-dashboard-option="avaliacoes">&#x2B50; Avaliações</a>
         </nav>

         <a class="logout" href="#">Sair da Conta</a>
      </aside>

      <main class="dashboardMain">
         <header class="topBar">
            <h1>Painel Administrativo AumigoPet</h1>
         </header>

         <!--
            Área exclusiva para o JavaScript inserir os fragmentos de
            owner-dashboard-content.html. Troque o conteúdo deste elemento
            conforme a opção selecionada na sidebar.
         -->
         <section class="content" id="dashboard-content" aria-live="polite">
            <!-- Conteúdo carregado pelo JavaScript -->
         </section>
      </main>
   </div>

   <script type="module" src="js/main.js"></script>
</body>
</html>
