<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AumigoPet</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/mainPage.css">
    <link rel="stylesheet" href="css/myPets.css">   
    <link rel="stylesheet" href="css/petHistory.css">
    <link rel="stylesheet" href="css/newService.css">
    <link rel="stylesheet" href="css/rateService.css">
    <link rel="stylesheet" href="css/myProfile.css">
    <link rel="stylesheet" href="css/schedules.css">
</head>
<body>
    <div class="app">
        <aside class="sideBar">
            <a href="#/mainPage">
                <img src="assets/logo.webp" alt="AumigoPet" class="logo">
            </a>
            <nav class="menu">
                <a href="#/mainPage">Painel Principal</a>
                <a href="#/myPets">Meus Pets</a>
                <a href="#/schedules">Agendamentos</a>
                <a href="#/myProfile">Meu Perfil</a>
            </nav>
            <a href="#" class="logout">Sair</a>
        </aside>
        <div class="main">
            <header class="topBar">
                <p class="subText" id="topTitle"></p>
                <div class="user" id="userName">User</div>
            </header>
            <div class="content" id="view"></div>
        </div>
    </div>
    <template id="mainPage">
        <h1>Painel de Controle</h1>
                <p class="subText">Acompanhe aqui os seus agendamentos e os seus pets.</p>
                <section class="stats">
                    <div class="card">
                        <p class="label">Pets Cadastrados</p>
                        <div class="number" id="numPets"></div>
                    </div>
                    <div class="card">
                        <p class="label">Agendamentos Ativos</p>
                        <div class="number" id="numSchedules"></div>
                    </div>
                    <div class="card">
                        <p class="label">Atendimentos Realizados</p>
                        <div class="number" id="numCompleted"></div>
                    </div>
                </section>
                <section class="twoColumns">
                    <div class="card">
                        <div class="cardFunctional">
                            <h2>Próximos Atendimentos</h2>
                            <a href="#/schedules" class="btnSeeAll">Ver todos</a>
                        </div>
                        <div id="scheduleList"></div>
                    </div>
                    <div class="card">
                        <div class="cardFunctional">
                            <h2>Seus Pets</h2>
                            <a href="#/myPets" class="btnManage">Gerenciar</a>   
                        </div>
                        <div id="petList"></div>                         
                        <a href="#/myPets/petConfig" class="btnDashed">+ Adicionar Novo Pet</a>
                    </div>
                </section>
                <section class="addServiceBanner">
                        <div>
                            <h2>Precisa agendar um novo cuidado?</h2>
                            <p> Escolha o melhor horário para o seu serviço.</p>
                        </div>
                        <a href="#/newService" class="btnSchedule">Agendar Agora</a>
                </section>
    </template>
    <template id="myPets">
        <div class="pageHeader">
            <div>
                <h1>Gerenciar Meus Pets</h1>
                <p class="subText">Visualize, edite ou cadastre novos animais para os atendimentos.</p>
            </div>
            <a href="#/myPets/petConfig" class="btnPrimary">+ Novo Pet</a>
        </div>
        <section class="pets">
            <div class="petCards" id="petCards"></div>
        </section>
    </template>
    <template id="petConfig">
        <h1>Configurar Pet</h1>
        <p class="subText">Preencha as informações do animal para facilitar o atendimento no petshop.</p>
        <section class="managePet">
            <div class="formCard">
                <form action="">
                    <p class="subText requiredNote"> <span class="asterisk">*</span> Campos Obrigatórios .</p>
                    <div class="row">
                        <div class="field">
                            <label for="name">Nome do Pet *</label>
                            <input type="text" id="name" name="name" placeholder="Ex:Teddy" required>
                        </div>
                        <div class="field">
                            <label for="species">Espécie *</label>
                            <select name="species" id="species" required>
                                <option value="dog">Cão</option>
                                <option value="cat">Gato</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="breed">Raça *</label>
                            <input type="text" name="breed" id="breed" placeholder="Ex: Husky, Golden Retriever ..." required>
                        </div>
                        <div class="field">
                            <label for="size">Porte *</label>
                            <select name="size" id="size" required>
                                <option value="small">Pequeno (até 10kg)</option>
                                <option value="medium">Médio (até 25kg)</option>
                                <option value="big">Grande (acima de 25kg)</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="fur">Tipo de Pelagem *</label>
                            <select name="fur" id="fur" required>
                                <option value="smoothCoat">Curto e liso</option>
                                <option value="silkyCoat">Longo e liso</option>
                                <option value="wavy/curlyCoat">Longo ou ondulado/encaracolado</option>
                                <option value="brokenCoat">Curto duro ou áspero</option>
                                <option value="doubleCoat">Pelagem dupla</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="age">Idade *</label>
                            <input type="text" name="age" id="age" placeholder="Ex: 2 anos ou 4 meses" pattern="\d{1,2} (ano|anos|mês|meses)" title="Use o formato: 3 anos ou 8 meses" required>
                        </div>
                    </div>
                    <div class="field">
                        <label for="notes">Observações (Alergias, Temperamento, Cuidados Especiais)</label>
                        <textarea name="notes" id="notes" placeholder="Ex: Sensível a secador quente, um pouco arisco com outros animais, alergia a shampoo com essência de lavanda..."></textarea>
                    </div>
                    <div class="formActions">
                        <a href="#/myPets" class="btnCancel">Cancelar</a>
                        <button type="submit" class="btnSave">Salvar Pet</button>
                    </div>
                </form>
            </div>
        </section>
    </template>
    <template id="petHistory">
        <div class="pageHeader">
                    <div>
                        <h1>Histórico de atendimentos</h1>
                        <p class="subText petInfo"> <strong id="petName"></strong> • <strong id="petSize"></strong> • <strong id="age"></strong> • <strong id="numServices"></strong></p>
                    </div>
                    <a href="#/myPets" class="btnPrimary">Voltar para Meus Pets</a>
                </div>
                <section class="petHistory">
                    <div class="historyCard" id="historyCard">
                        <h2>Linha do Tempo de Atendimentos</h2>
                        <table class="historyTable">
                            <thead>
                                <tr>
                                    <th>Data</th>
                                    <th>Serviço Realizado</th>
                                    <th>Valor Pago</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody id="historyRows"></tbody>
                        </table>
                    </div>
                </section>
    </template>
    <template id="schedules">
        <div class="pageHeader">
                    <div>
                        <h1>Meus Agendamentos</h1>
                        <p class="subText">Acompanhe o status dos atendimentos agendados e consulte o histórico.</p>
                    </div>
                    <a href="#/newService" class="btnPrimary">+ Novo Agendamento</a>
                </div>
                <section class="services">
                    <div class="scheduleCards" id="schedule"></div>
                </section>
    </template>
    <template id="newService">
         <h1>Realizar Novo Agendamento</h1>
                <p class="subText">Selecione o pet, o serviço, a data e o horário livre desejado.</p>
                <section class="booking">
                    <div class="bookingCard">
                        <form action="">
                            <p class="subText requiredNote"> <span class="asterisk">*</span> Campos Obrigatórios .</p>
                            <div class="row">
                                <div class="field">
                                    <label for="pet">Selecionar Pet *</label>
                                    <select id="pet" name="pet" required>
                                        <option value="">Selecione o pet</option>
                                    </select>
                                </div>
                                <div class="field">
                                    <label for="service">Selecionar Serviço *</label>
                                    <select id="service" name="service" required>
                                        <option value="">Selecione o serviço</option>
                                    </select>
                                </div>
                            </div>
                            <div class="row">
                                <div class="field">
                                    <label for="date">Data do Atendimento *</label>
                                    <input type="date" id="date" name="date" required>
                                </div>
                            </div>
                            <div class="field">
                                <p class="fieldTitle">Horários Livres Disponíveis *</p>
                                <div class="slots" id="slots">
                                    <button type="button" class="slot">09:00</button>
                                    <button type="button" class="slot">10:15</button>
                                    <button type="button" class="slot">11:30</button>
                                    <button type="button" class="slot">14:00</button>
                                    <button type="button" class="slot">15:30</button>
                                    <button type="button" class="slot">17:00</button>
                                </div>
                            </div>
                            <div class="summary">
                                <div>
                                    <strong>Resumo do Serviço:</strong>
                                    <p id="summaryText">Selecione um serviço para ver os detalhes.</p>
                                </div>
                                <strong class="summaryPrice" id="summaryPrice">R$ 0,00</strong>
                            </div>
                            <div class="formActions">
                                <a href="#/schedules" class="btnCancel">Cancelar</a>
                                <button type="submit" class="btnSave">Confirmar Agendamento</button>
                            </div>
                        </form>
                    </div>
                </section>
    </template>
    <template id="rateService">
        <h1>Avaliar Atendimento</h1>
                <p class="subText">Sua opinião é fundamental para mantermos a excelência no cuidado com seu pet.</p>
                <section class="suggest">
                    <div class="suggestCard">
                        <p class="reviewInfo">
                            Atendimento: <strong id="reviewService">Serviço</strong>
                            • Realizado em <span id="reviewDate">--/--/----</span>
                        </p>
                        <form action="" id="reviewForm">
                                <div class="stars">
                                    <button type="button" class="star">★</button>
                                    <button type="button" class="star">★</button>
                                    <button type="button" class="star">★</button>
                                    <button type="button" class="star">★</button>
                                    <button type="button" class="star">★</button>
                                </div>
                                <p class="hint">Clique nas estrelas para selecionar sua nota</p>
                                <div class="field">
                                    <label for="comment">Deixe um comentário (opcional)</label>
                                    <textarea id="comment" name="comment" placeholder="Conte como foi a experiência..."></textarea>
                                </div>
                                <div class="formActions actionsCenter">
                                    <a href="#/schedules" class="btnCancel">Cancelar</a>
                                    <button type="submit" class="btnSave">Enviar Avaliação</button>
                                </div>
                        </form>
                    </div>
                </section>
    </template>
    <template id="myProfile">
        <h1>Meu Perfil</h1>
                <p class="subText">Atualize suas informações pessoais e credenciais de acesso.</p>
                <section class="data">
                    <div class="info">
                        <h2>Informações Pessoais</h2>
                        <form action="" id="personalForm">
                            <div class="field">
                                <label for="name">Nome Completo</label>
                                <input type="text" id="name" name="name" placeholder="Seu Nome Completo">
                            </div>
                            <div class="row">
                                <div class="field">
                                    <label for="mail">E-mail</label>
                                    <input type="email" id="mail" name="mail" placeholder="Seu E-mail">
                                </div>
                                <div class="field">
                                     <label for="contact">Telefone/WhatsApp</label>
                                    <input type="tel" id="contact" name="contact" placeholder="(XX) 9XXXX-XXXX">
                                </div>
                            </div>
                            <button type="submit" class="btnSave btnRight">Salvar Alterações</button>
                        </form>
                    </div>
                    <div class="info">
                        <h2>Segurança e Senha</h2>
                        <form action="" id="securityForm">
                            <p class="subText requiredNote"> <span class="asterisk">*</span> Campos Obrigatórios .</p>
                            <div class="field">
                                <label for="passWord">Senha Atual *</label>
                                <input type="password" id="passWord" name="passWord" placeholder="Sua senha atual" required>
                            </div>
                            <div class="row">
                                <div class="field">
                                    <label for="newPassword">Nova Senha *</label>
                                    <input type="password" id="newPassword" name="newPassword" placeholder="Mín. 6 caracteres, 1 maiúscula, 1 número, 1 símbolo" required>
                                </div>
                                <div class="field">
                                     <label for="confirmPassWord">Confirme Nova Senha *</label>
                                    <input type="password" id="confirmPassWord" name="confirmPassWord" placeholder="Confirme a nova senha" required>
                                </div>
                            </div>
                        <button type="submit" class="btnSave">Atualizar Senha</button>
                        </form>
                    </div>
                </section>
    </template>
    <dialog id="appDialog" class="customDialog">
        <p id="appDialogMessage"></p>
        <button type="button" id="appDialogBtn" class="btnSave">OK</button>
    </dialog>
    
    <dialog id="confirmDialog" class="customDialog">
        <p id="confirmDialogMessage"></p>
        <div class="dialogActions">
            <button type="button" id="confirmDialogNo" class="btnCancel">Voltar</button>
            <button type="button" id="confirmDialogYes" class="btnSave">Confirmar</button>
        </div>
    </dialog>

    <script src="js/data.js"></script>
    <script src="js/mainPage.js"></script>
    <script src="js/myPets.js"></script>
    <script src="js/petHistory.js"></script>
    <script src="js/petConfig.js"></script>
    <script src="js/newService.js"></script>
    <script src="js/rateService.js"></script>
    <script src="js/myProfile.js"></script>
    <script src="js/schedules.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
